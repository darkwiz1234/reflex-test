<!DOCTYPE html>
<html>
<head>
  <title>Game Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      color: white;
    }
    h1 { margin-top: 50px; }
    .menu {
      margin-top: 100px;
    }
    button {
      margin: 20px;
      padding: 20px 40px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #222;
      color: #fff;
      transition: 0.3s;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <h1>Welcome to Reflex Hub</h1>
  <div class="menu">
    <button onclick="location.href='reflex-test.html'">Quick Reflex Game</button>
    <button onclick="location.href='obstacle.html'">Obstacle Course Game</button>

</html>
