<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick REFLEX Game ⚡</title>
    <style>
        * { 
            box-sizing: border-box; 
            user-select: none; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        body { 
            margin: 0; 
            background-color: #fcdbd3; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            color: #333;
            position: relative; /* Needed for absolute positioning of back arrow */
        }
        
        /* Top Left Back Arrow */
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #333;
            transition: transform 0.2s, color 0.2s;
            z-index: 100;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .back-arrow:hover {
            transform: scale(1.1);
            color: #f44336;
        }

        h1 { 
            font-size: 2.5rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-bottom: 20px; 
        }
        
        .game-board {
            background: #ffffff; 
            width: 100%; 
            max-width: 800px; 
            padding: 40px; 
            border-radius: 10px; 
            display: flex; 
            justify-content: center; 
            margin-bottom: 20px;
        }
        
        .grid {
            display: grid; 
            grid-template-columns: repeat(3, 100px); 
            grid-gap: 15px;
        }
        
        .cell {
            width: 100px; 
            height: 100px; 
            background-color: #ececec; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background-color 0.1s;
        }
        
        .cell.active { 
            background-color: #ffd900; 
            box-shadow: 0 0 15px #ffd900; 
        }
        
        .stats-panel {
            background: #ffffff; 
            padding: 20px 40px; 
            border-radius: 10px; 
            text-align: center; 
            margin-bottom: 20px; 
            font-weight: 500; 
            font-size: 1.1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .stats-panel p { margin: 5px 0; }
        
        .controls { display: flex; gap: 15px; }
        
        .btn {
            padding: 10px 25px; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 1rem; 
            cursor: pointer; 
            color: #333; 
            transition: transform 0.1s;
        }
        
        .btn:active { transform: scale(0.95); }
        .btn-start { background-color: #4CAF50; color: white; }
        .btn-pause { background-color: #FFB300; color: white; }
        .btn-back { background-color: #81D4FA; }
        .btn-reset { background-color: #69F0AE; }
    </style>
</head>
<body>

    <!-- Back Arrow to Hub -->
    <a href="index.html" class="back-arrow" title="Back to Hub">
        <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <h1>REFLEX GAME ⚡</h1>

    <div class="game-board">
        <div class="grid" id="grid">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
    </div>

    <div class="stats-panel">
        <p>Score: <span id="score">0</span></p>
        <p>Streak: <span id="streak">0</span></p>
        <p>Last Reaction: <span id="last-reaction">0</span> ms</p>
        <p>Best Reaction: <span id="best-reaction">--</span> ms</p>
        <p>Average Reaction: <span id="avg-reaction">--</span> ms</p>
    </div>

    <div class="controls">
        <button class="btn btn-start" id="btn-start">Start</button>
        <button class="btn btn-pause" id="btn-pause">Pause</button>
        <button class="btn btn-back" onclick="window.location.href='index.html'">Back</button>
        <button class="btn btn-reset" id="btn-reset">Reset</button>
    </div>

    <script>
        const cells = document.querySelectorAll('.cell');
        let isPlaying = false;
        let activeIndex = -1;
        let spawnTime = 0;
        let timerId = null;

        let stats = { score: 0, streak: 0, last: 0, best: Infinity, totalTime: 0 };

        function updateUI() {
            document.getElementById('score').innerText = stats.score;
            document.getElementById('streak').innerText = stats.streak;
            document.getElementById('last-reaction').innerText = stats.last;
            document.getElementById('best-reaction').innerText = stats.best === Infinity ? '--' : stats.best;
            document.getElementById('avg-reaction').innerText = stats.score > 0 ? Math.round(stats.totalTime / stats.score) : '--';
        }

        function spawnTarget() {
            if (!isPlaying) return;
            if (activeIndex !== -1) cells[activeIndex].classList.remove('active');
            
            activeIndex = Math.floor(Math.random() * 9);
            cells[activeIndex].classList.add('active');
            spawnTime = performance.now();
        }

        cells.forEach(cell => {
            cell.addEventListener('mousedown', (e) => {
                if (!isPlaying) return;
                const clickedIndex = parseInt(e.target.getAttribute('data-index'));

                if (clickedIndex === activeIndex) {
                    const reactTime = Math.round(performance.now() - spawnTime);
                    stats.score++;
                    stats.streak++;
                    stats.last = reactTime;
                    stats.totalTime += reactTime;
                    if (reactTime < stats.best) stats.best = reactTime;
                    
                    cells[activeIndex].classList.remove('active');
                    activeIndex = -1;
                    updateUI();
                    
                    clearTimeout(timerId);
                    timerId = setTimeout(spawnTarget, Math.random() * 500 + 200);
                } else {
                    stats.streak = 0;
                    updateUI();
                }
            });
        });

        document.getElementById('btn-start').addEventListener('click', () => {
            if (!isPlaying) { 
                isPlaying = true; 
                spawnTarget(); 
            }
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            isPlaying = false;
            clearTimeout(timerId);
            if (activeIndex !== -1) cells[activeIndex].classList.remove('active');
            activeIndex = -1;
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            isPlaying = false;
            clearTimeout(timerId);
            if (activeIndex !== -1) cells[activeIndex].classList.remove('active');
            activeIndex = -1;
            stats = { score: 0, streak: 0, last: 0, best: Infinity, totalTime: 0 };
            updateUI();
        });
    </script>
</body>
</html>
