<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBJECT RUN 🏃</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{
    background:#111;
    color:#fff;
    text-align:center;
    transition:.5s;
}
h1{margin:15px}
#info{
    margin:10px;
    font-size:20px;
}
canvas{
    background:#222;
    border:3px solid #fff;
}
button{
    margin:10px 5px;
    padding:8px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}
#pause{background:orange;color:#fff}
#reset{background:red;color:#fff}
#msg{
    color:#ff5252;
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>OBJECT RUN 🏃</h1>

<div id="info">
    Score: <span id="score">0</span>
    |
    High Score: <span id="high">0</span>
</div>

<canvas id="game" width="900" height="350"></canvas>

<br>

<button id="pause">Pause</button>
<button id="reset">Reset</button>

<div id="msg"></div>

<audio id="hit" src="collision.mp3"></audio>
<audio id="music" src="music.mp3" loop></audio>

<script>

const c=document.getElementById("game"),
ctx=c.getContext("2d"),
scoreEl=document.getElementById("score"),
highEl=document.getElementById("high"),
msg=document.getElementById("msg"),
music=document.getElementById("music"),
hit=document.getElementById("hit");

let score=0,
high=localStorage.getItem("objRunHigh")||0,
run=true,
pause=false;

highEl.textContent=high;

const G=300;

let p={
    x:120,
    y:G-40,
    w:40,
    h:40,
    vy:0,
    ground:true
};

let obs=[];

const types={
    ground:[60,40,G-40],
    ramp:[70,80,G-80],
    floating:[70,25,180],
    spike:[40,40,G-40]
};

document.addEventListener("keydown",e=>{
    if((e.code==="Space"||e.code==="ArrowUp")&&p.ground&&run&&!pause){
        p.vy=-13;
        p.ground=false;
    }
});

c.onclick=()=>{
    if(p.ground&&run&&!pause){
        p.vy=-13;
        p.ground=false;
    }
};

function spawn(){
    if(run&&!pause){

        let t=Object.keys(types)[
            Math.floor(Math.random()*4)
        ];

        let [w,h,y]=types[t];

        obs.push({
            t,x:c.width+20,w,h,y,count:false
        });
    }

    setTimeout(
        spawn,
        500+Math.random()*500
    );
}

spawn();

function theme(){
    document.body.style.background=
        score>=100?"#6b5700":
        score>=50?"#4d1200":
        score>=20?"#31124a":
        "#111";
}

function over(){

    if(!run)return;

    run=false;

    music.pause();

    hit.currentTime=0;
    hit.play();

    msg.textContent=
    "GAME OVER! Press Reset";

    if(score>high){
        high=score;
        localStorage.setItem(
            "objRunHigh",
            high
        );
        highEl.textContent=high;
    }
}

function reset(){

    score=0;
    scoreEl.textContent=0;

    obs=[];

    p.y=G-40;
    p.vy=0;
    p.ground=true;

    run=true;
    pause=false;

    document.getElementById("pause")
    .textContent="Pause";

    msg.textContent="";

    theme();

    music.currentTime=0;
    music.play().catch(()=>{});
}

document.getElementById("pause")
.onclick=()=>{

    if(!run)return;

    pause=!pause;

    document.getElementById("pause")
    .textContent=
    pause?"Resume":"Pause";

    pause?music.pause():
    music.play().catch(()=>{});
};

document.getElementById("reset")
.onclick=reset;

window.addEventListener("click",()=>{
    music.play().catch(()=>{});
},{once:true});

function collide(a,b){
    return(
        a.x<b.x+b.w &&
        a.x+a.w>b.x &&
        a.y<b.y+b.h &&
        a.y+a.h>b.y
    );
}

function update(){

    if(!run||pause)return;

    p.vy+=0.7;
    p.y+=p.vy;
    p.ground=false;

    if(p.y+p.h>=G){
        p.y=G-p.h;
        p.vy=0;
        p.ground=true;
    }

    for(let i=obs.length-1;i>=0;i--){

        let o=obs[i];

        o.x-=5;

        if(
            !o.count &&
            o.x+o.w<0
        ){
            o.count=true;
            score++;
            scoreEl.textContent=score;
            theme();
            obs.splice(i,1);
            continue;
        }

        if(!collide(p,o))continue;

        if(o.t==="spike"){
            over();
            return;
        }

        if(
            p.y+p.h<=o.y+12 &&
            p.vy>=0
        ){
            p.y=o.y-p.h;
            p.vy=0;
            p.ground=true;
        }
        else{
            over();
            return;
        }
    }
}

function draw(){

    ctx.clearRect(0,0,c.width,c.height);

    ctx.fillStyle="#555";
    ctx.fillRect(
        0,G,
        c.width,
        c.height-G
    );

    ctx.fillStyle="#00e5ff";
    ctx.fillRect(
        p.x,p.y,
        p.w,p.h
    );

    obs.forEach(o=>{

        if(o.t==="spike"){

            ctx.fillStyle="red";

            ctx.beginPath();
            ctx.moveTo(o.x,o.y+o.h);
            ctx.lineTo(o.x+o.w/2,o.y);
            ctx.lineTo(o.x+o.w,o.y+o.h);
            ctx.fill();

        }else{

            ctx.fillStyle=
            o.t==="floating"
            ?"#00ff95"
            :o.t==="ramp"
            ?"orange"
            :"#aaa";

            ctx.fillRect(
                o.x,o.y,
                o.w,o.h
            );
        }
    });
}

(function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
})();
</script>

</body>
</html>
