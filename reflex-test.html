<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Reflex Test ⚡</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Segoe+UI:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        /* Glowing Back Arrow */
        .back-arrow {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #0ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, filter 0.2s;
            filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.6));
            z-index: 100;
        }

        .back-arrow:hover {
            transform: scale(1.15) translateX(-3px);
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 1));
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* Central Play Area */
        #play-area {
            width: 90%;
            max-width: 600px;
            height: 320px;
            background-color: #1f2833;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 0 2px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease-out;
            padding: 20px;
        }

        #play-area:active {
            transform: scale(0.97);
        }

        #instruction {
            font-size: 2.8rem;
            font-weight: 800;
            margin: 0;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        #sub-instruction {
            font-size: 1.2rem;
            margin-top: 15px;
            opacity: 0.8;
            pointer-events: none;
            font-weight: 600;
        }

        /* Stats Panel */
        .stats-panel {
            background: #151a22;
            margin-top: 30px;
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 90%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            border: 1px solid #1f2833;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            font-size: 1rem;
            color: #8892b0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.8rem;
            color: #0ff;
            font-weight: 800;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            font-family: 'Orbitron', sans-serif;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        .btn {
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Segoe UI', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-start { 
            background-color: #4caf50; 
            box-shadow: 0 6px 0 #2e7d32, 0 10px 20px rgba(76, 175, 80, 0.4);
        }
        .btn-start:hover { transform: translateY(-4px); box-shadow: 0 10px 0 #2e7d32, 0 15px 25px rgba(76, 175, 80, 0.5); }
        .btn-start:active { transform: translateY(6px); box-shadow: 0 0 0 #2e7d32; }
        
        .btn-reset { 
            background-color: #f44336; 
            box-shadow: 0 6px 0 #c62828, 0 10px 20px rgba(244, 67, 54, 0.4);
        }
        .btn-reset:hover { transform: translateY(-4px); box-shadow: 0 10px 0 #c62828, 0 15px 25px rgba(244, 67, 54, 0.5); }
        .btn-reset:active { transform: translateY(6px); box-shadow: 0 0 0 #c62828; }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            #instruction { font-size: 2rem; }
            .stats-panel { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- Glowing Back Arrow -->
    <a href="index.html" class="back-arrow" title="Back to Hub">
        <svg viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <h1>REFLEX TEST ⚡</h1>

    <!-- Central Interactive Box -->
    <div id="play-area">
        <h2 id="instruction">Click Start Below</h2>
        <p id="sub-instruction">When the area turns green, click it as fast as you can!</p>
    </div>

    <!-- Scoreboard -->
    <div class="stats-panel">
        <div class="stat-item">
            Last Reaction
            <span id="last-time" class="stat-value">-- ms</span>
        </div>
        <div class="stat-item">
            Best Reaction
            <span id="best-time" class="stat-value">-- ms</span>
        </div>
    </div>

    <!-- Buttons -->
    <div class="controls">
        <button id="start-btn" class="btn btn-start">Start Game</button>
        <button id="reset-btn" class="btn btn-reset">Reset Stats</button>
    </div>

    <script>
        // Game State Variables
        let state = 'IDLE'; // States: IDLE, WAITING, READY, RESULT
        let timeoutId = null;
        let startTime = 0;
        let bestTime = Infinity;

        // DOM Elements
        const playArea = document.getElementById('play-area');
        const instruction = document.getElementById('instruction');
        const subInstruction = document.getElementById('sub-instruction');
        const lastTimeEl = document.getElementById('last-time');
        const bestTimeEl = document.getElementById('best-time');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');

        // Start Game Flow
        function startGame() {
            if (state === 'WAITING' || state === 'READY') return;

            state = 'WAITING';
            startBtn.innerText = "Try Again";
            
            // Visual feedback for waiting
            playArea.style.backgroundColor = '#d32f2f'; // Deep Red
            playArea.style.color = '#ffffff';
            instruction.innerText = 'Wait for Green...';
            subInstruction.innerText = 'Do not click yet!';
            document.body.style.backgroundColor = '#0b0c10'; 

            // Set random delay between 2 and 5 seconds
            const delay = Math.floor(Math.random() * 3000) + 2000;
            
            timeoutId = setTimeout(triggerSignal, delay);
        }

        // Trigger the visual cue
        function triggerSignal() {
            state = 'READY';
            playArea.style.backgroundColor = '#388e3c'; // Vibrant Green
            instruction.innerText = 'CLICK NOW!';
            subInstruction.innerText = '';
            
            startTime = performance.now(); // Start high-precision timer
        }

        // Handle clicking on the big game area
        function handleAreaClick() {
            if (state === 'WAITING') {
                // Clicked too early penalty
                clearTimeout(timeoutId);
                state = 'IDLE';
                
                playArea.style.backgroundColor = '#1f2833';
                playArea.style.color = '#fff';
                instruction.innerText = 'Too Soon!';
                subInstruction.innerText = 'You clicked before green. Try again.';
                
                // Penalty background flash
                document.body.style.backgroundColor = '#3a0c0c'; 
                setTimeout(() => {
                    if(state === 'IDLE') document.body.style.backgroundColor = '#0b0c10';
                }, 1000);
            } 
            else if (state === 'READY') {
                // Successful reaction
                const endTime = performance.now();
                const reactionTime = Math.round(endTime - startTime);
                
                state = 'RESULT';
                
                // Update stats
                lastTimeEl.innerText = `${reactionTime} ms`;
                
                if (reactionTime < bestTime) {
                    bestTime = reactionTime;
                    bestTimeEl.innerText = `${bestTime} ms`;
                }
                
                // Visual feedback in play area
                playArea.style.backgroundColor = '#1f2833';
                playArea.style.color = '#fff';
                instruction.innerText = `${reactionTime} ms`;
                subInstruction.innerText = 'Click "Try Again" to replay';
                
                // Background theme shift based on performance
                if (reactionTime < 200) {
                    document.body.style.backgroundColor = '#3e2700'; // Gold/Fast
                } else if (reactionTime < 300) {
                    document.body.style.backgroundColor = '#0b162c'; // Deep Blue/Good
                } else {
                    document.body.style.backgroundColor = '#2c0b0b'; // Dark Red/Slow
                }
            }
        }

        // Completely reset the game and scoreboard
        function resetStats() {
            clearTimeout(timeoutId);
            state = 'IDLE';
            bestTime = Infinity;
            lastTimeEl.innerText = '-- ms';
            bestTimeEl.innerText = '-- ms';
            
            startBtn.innerText = "Start Game";
            instruction.innerText = 'Click Start Below';
            subInstruction.innerText = 'When the area turns green, click it as fast as you can!';
            
            playArea.style.backgroundColor = '#1f2833';
            playArea.style.color = '#fff';
            document.body.style.backgroundColor = '#0b0c10';
        }

        // Event Listeners
        startBtn.addEventListener('click', startGame);
        resetBtn.addEventListener('click', resetStats);
        
        // Touch support for mobile responsiveness
        playArea.addEventListener('mousedown', handleAreaClick);
        playArea.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            handleAreaClick();
        });

    </script>
</body>
</html>
