
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBJECT RUN 🏃</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#111;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    min-height:100vh;
    transition:background 0.6s;
}

h1{
    margin:20px 0 10px;
    font-size:2.2rem;
    text-shadow:0 0 10px cyan;
}

#info{
    display:flex;
    gap:20px;
    margin-bottom:10px;
    font-size:1.1rem;
}

canvas{
    border:3px solid white;
    background:#1d1d1d;
    box-shadow:0 0 20px rgba(255,255,255,0.3);
}

.controls{
    margin-top:15px;
    display:flex;
    gap:10px;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

#pauseBtn{
    background:#ff9800;
    color:white;
}

#resetBtn{
    background:#f44336;
    color:white;
}

.purple-theme{
    background:#2b1247;
}

.fire-theme{
    background:#3a0900;
}

.gold-theme{
    background:#3a3100;
}

#message{
    margin-top:10px;
    font-size:1.2rem;
    font-weight:bold;
    color:#ff5252;
}
</style>
</head>

<body>

<h1>OBJECT RUN 🏃</h1>

<div id="info">
    <div>Score: <span id="score">0</span></div>
    <div>High Score: <span id="highScore">0</span></div>
</div>

<canvas id="gameCanvas" width="900" height="350"></canvas>

<div class="controls">
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>
</div>

<div id="message"></div>

<audio id="collisionSound" src="collision.mp3"></audio>
<audio id="bgMusic" src="music.mp3" loop></audio>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const highScoreEl = document.getElementById("highScore");
const pauseBtn = document.getElementById("pauseBtn");
const resetBtn = document.getElementById("resetBtn");
const messageEl = document.getElementById("message");

const collisionSound = document.getElementById("collisionSound");
const bgMusic = document.getElementById("bgMusic");

let highScore = localStorage.getItem("objectRunHighScore") || 0;
highScoreEl.textContent = highScore;

const GRAVITY = 0.7;
const JUMP_FORCE = -13;
const GROUND_Y = 300;

let gameRunning = true;
let paused = false;
let score = 0;

const player = {
    x: 120,
    y: GROUND_Y - 40,
    width: 40,
    height: 40,
    velocityY: 0,
    onGround: true,
    color: "#00e5ff"
};

const obstacles = [];

function updateTheme() {
    document.body.classList.remove(
        "purple-theme",
        "fire-theme",
        "gold-theme"
    );

    if(score >= 100){
        document.body.classList.add("gold-theme");
    } else if(score >= 50){
        document.body.classList.add("fire-theme");
    } else if(score >= 20){
        document.body.classList.add("purple-theme");
    }
}

function jump(){
    if(player.onGround && gameRunning && !paused){
        player.velocityY = JUMP_FORCE;
        player.onGround = false;
    }
}

document.addEventListener("keydown", e=>{
    if(e.code === "Space" || e.code === "ArrowUp"){
        e.preventDefault();
        jump();
    }
});

canvas.addEventListener("click", jump);

function createObstacle(){

    const types = ["ground","ramp","floating","spike"];
    const type = types[Math.floor(Math.random()*types.length)];

    let obstacle = {
        type,
        x: canvas.width + 20,
        counted:false
    };

    if(type === "ground"){
        obstacle.width = 60;
        obstacle.height = 40;
        obstacle.y = GROUND_Y - obstacle.height;
    }

    if(type === "ramp"){
        obstacle.width = 70;
        obstacle.height = 80;
        obstacle.y = GROUND_Y - obstacle.height;
    }

    if(type === "floating"){
        obstacle.width = 70;
        obstacle.height = 25;
        obstacle.y = 180;
    }

    if(type === "spike"){
        obstacle.width = 40;
        obstacle.height = 40;
        obstacle.y = GROUND_Y - obstacle.height;
    }

    obstacles.push(obstacle);
}

setInterval(()=>{
    if(gameRunning && !paused){
        createObstacle();
    }
}, 2000 + Math.random()*1000);

function drawPlayer(){
    ctx.fillStyle = player.color;
    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );
}

function drawObstacle(o){

    if(o.type === "spike"){
        ctx.fillStyle = "red";

        ctx.beginPath();
        ctx.moveTo(o.x, o.y + o.height);
        ctx.lineTo(o.x + o.width/2, o.y);
        ctx.lineTo(o.x + o.width, o.y + o.height);
        ctx.closePath();
        ctx.fill();
        return;
    }

    if(o.type === "floating"){
        ctx.fillStyle = "#00ff95";
    }
    else if(o.type === "ramp"){
        ctx.fillStyle = "#ff9800";
    }
    else{
        ctx.fillStyle = "#9e9e9e";
    }

    ctx.fillRect(
        o.x,
        o.y,
        o.width,
        o.height
    );
}

function collisionRect(a,b){
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function handleCollisions(){

    player.onGround = false;

    if(player.y + player.height >= GROUND_Y){
        player.y = GROUND_Y - player.height;
        player.velocityY = 0;
        player.onGround = true;
    }

    for(let o of obstacles){

        if(!collisionRect(player,o)) continue;

        if(o.type === "spike"){
            gameOver();
            return;
        }

        const playerBottom = player.y + player.height;
        const playerTop = player.y;
        const playerRight = player.x + player.width;
        const playerLeft = player.x;

        const obstacleTop = o.y;
        const obstacleBottom = o.y + o.height;
        const obstacleLeft = o.x;
        const obstacleRight = o.x + o.width;

        const overlapTop = playerBottom - obstacleTop;
        const overlapBottom = obstacleBottom - playerTop;
        const overlapLeft = playerRight - obstacleLeft;
        const overlapRight = obstacleRight - playerLeft;

        const minOverlap = Math.min(
            overlapTop,
            overlapBottom,
            overlapLeft,
            overlapRight
        );

        if(minOverlap === overlapTop &&
           player.velocityY >= 0){

            player.y = obstacleTop - player.height;
            player.velocityY = 0;
            player.onGround = true;
        }
        else{
            gameOver();
            return;
        }
    }
}

function gameOver(){

    if(!gameRunning) return;

    gameRunning = false;

    bgMusic.pause();

    collisionSound.currentTime = 0;
    collisionSound.play();

    messageEl.textContent =
        "GAME OVER! Press Reset to play again.";

    if(score > highScore){
        highScore = score;
        localStorage.setItem(
            "objectRunHighScore",
            highScore
        );
        highScoreEl.textContent = highScore;
    }
}

function resetGame(){

    score = 0;
    scoreEl.textContent = score;

    obstacles.length = 0;

    player.y = GROUND_Y - player.height;
    player.velocityY = 0;
    player.onGround = true;

    gameRunning = true;
    paused = false;

    pauseBtn.textContent = "Pause";

    messageEl.textContent = "";

    updateTheme();

    bgMusic.currentTime = 0;

    bgMusic.play().catch(()=>{});
}

pauseBtn.addEventListener("click",()=>{

    if(!gameRunning) return;

    paused = !paused;

    if(paused){
        pauseBtn.textContent = "Resume";
        bgMusic.pause();
    }else{
        pauseBtn.textContent = "Pause";
        bgMusic.play().catch(()=>{});
    }
});

resetBtn.addEventListener("click", resetGame);

window.addEventListener("click", ()=>{
    if(bgMusic.paused && gameRunning && !paused){
        bgMusic.play().catch(()=>{});
    }
},{once:true});

function update(){

    if(!gameRunning || paused) return;

    player.velocityY += GRAVITY;
    player.y += player.velocityY;

    for(let i=obstacles.length-1;i>=0;i--){

        const o = obstacles[i];

        o.x -= 5;

        if(!o.counted && o.x + o.width < 0){

            o.counted = true;

            score++;
            scoreEl.textContent = score;

            updateTheme();

            obstacles.splice(i,1);
        }
    }

    handleCollisions();
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#444";
    ctx.fillRect(
        0,
        GROUND_Y,
        canvas.width,
        canvas.height - GROUND_Y
    );

    drawPlayer();

    for(const o of obstacles){
        drawObstacle(o);
    }
}

function gameLoop(){

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
