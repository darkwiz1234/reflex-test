
   <!DOCTYPE html>
<html>
<head>
  <title>OBJECT RUN 🏃</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to bottom, #add8e6, #00008b);
      margin: 0;
      padding: 0;
      color: #fff;
    }
    .title {
      font-size: 3em;
      font-weight: bold;
      margin: 20px 0;
      text-shadow: 3px 3px 8px rgba(0,0,0,0.5);
    }
    #gameBox {
      display: inline-block;
      background: #111;
      border: 4px solid #00f2fe;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      padding: 10px;
    }
    canvas {
      background: #222;
      display: block;
      margin: auto;
      border-radius: 8px;
    }
    #scoreboard {
      margin-top: 15px;
      font-size: 1.2em;
    }
    #controls {
      margin-top: 10px;
    }
    #controls button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }
    #pauseBtn { background: #f39c12; color: white; }
    #resetBtn { background: #4CAF50; color: white; }
    #controls button:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="title">OBJECT RUN 🏃</div>

  <div id="gameBox">
    <canvas id="gameCanvas" width="600" height="300"></canvas>
    <div id="scoreboard">
      Score: <span id="score">0</span> | Highest: <span id="highscore">0</span>
    </div>
    <div id="controls">
      <button id="pauseBtn" onclick="pauseGame()">Pause</button>
      <button id="resetBtn" onclick="resetGame()">Reset</button>
    </div>
  </div>

  <!-- Collision sound + Background music -->
  <audio id="hitSound" src="collision.mp3"></audio>
  <audio id="bgMusic" src="music.mp3" loop></audio>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let player = { x: 50, y: canvas.height - 30, width: 30, height: 30, dy: 0, jump: false, color: "#00f2fe" };
    let gravity = 0.8;
    let obstacles = [];
    let score = 0;
    let highscore = localStorage.getItem("highscore") || 0;
    document.getElementById("highscore").innerText = highscore;

    let gameRunning = false;
    let paused = false;
    let gameOver = false;

    function drawPlayer() {
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function drawObstacles() {
      obstacles.forEach(o => {
        if(o.type === "block") {
          ctx.fillStyle = "#ff4d4d";
          ctx.fillRect(o.x, o.y, o.width, o.height);
        } else if(o.type === "spike") {
          ctx.fillStyle = "#ffcc00";
          ctx.beginPath();
          ctx.moveTo(o.x, o.y + o.height);
          ctx.lineTo(o.x + o.width/2, o.y);
          ctx.lineTo(o.x + o.width, o.y + o.height);
          ctx.closePath();
          ctx.fill();
        }
      });
    }
    function updateTheme() {
      if(score >= 100) {
        document.body.style.background = "linear-gradient(to bottom, gold, darkorange)";
        player.color = "#FFD700";
      } else if(score >= 50) {
        document.body.style.background = "linear-gradient(to bottom, #ff7e5f, #feb47b)";
        player.color = "#ff3333";
      } else if(score >= 20) {
        document.body.style.background = "linear-gradient(to bottom, #8e2de2, #4a00e0)";
        player.color = "#a020f0";
      } else {
        document.body.style.background = "linear-gradient(to bottom, #add8e6, #00008b)";
        player.color = "#00f2fe";
      }
    }

    function update() {
      if(!gameRunning || paused) return;
      ctx.clearRect(0,0,canvas.width,canvas.height);

      if(player.jump) {
        player.dy = -12;
        player.jump = false;
      }
      player.y += player.dy;
      player.dy += gravity;
      if(player.y > canvas.height - player.height) {
        player.y = canvas.height - player.height;
        player.dy = 0;
      }

      obstacles.forEach(o => o.x -= 5);
      if(obstacles.length && obstacles[0].x + obstacles[0].width < 0) {
        obstacles.shift();
        score++;
        document.getElementById("score").innerText = score;
        if(score > highscore) {
          highscore = score;
          localStorage.setItem("highscore", highscore);
          document.getElementById("highscore").innerText = highscore;
        }
        updateTheme();
      }

      // Collision detection with bounce
      obstacles.forEach(o => {
        if(o.type === "block") {
          if(player.y + player.height <= o.y + 10 &&
             player.x + player.width > o.x && player.x < o.x + o.width &&
             player.dy >= 0) {
            player.y = o.y - player.height;
            player.dy = 0;
          } else if(player.x < o.x + o.width && player.x + player.width > o.x &&
                    player.y < o.y + o.height && player.y + player.height > o.y) {
            endGame();
          }
        } else if(o.type === "spike") {
          if(player.x < o.x + o.width && player.x + player.width > o.x &&
             player.y < o.y + o.height && player.y + player.height > o.y) {
            endGame();
          }
        }
      });

      drawPlayer();
      drawObstacles();
      requestAnimationFrame(update);
    }

    function pauseGame() {
      paused = !paused;
      if(!paused && gameRunning) update();
    }

    function endGame() {
      document.getElementById("hitSound").play().catch(e => {});
      document.getElementById("bgMusic").pause();
      gameRunning = false;
      gameOver = true;
      ctx.fillStyle = "white";
      ctx.font = "24px Arial";
      ctx.fillText("Game Over - Click to Restart", canvas.width/2 - 150, canvas.height/2);
    }

    function startGame() {
      score = 0;
      document.getElementById("score").innerText = score;
      obstacles = [];
      player.y = canvas.height - player.height;
      player.dy = 0;
      gameRunning = true;
      paused = false;
      gameOver = false;
      document.getElementById("bgMusic").play().catch(e => {});
      spawnObstacle();
      update();
    }

    function resetGame() {
      score = 0;
      highscore = 0;
      document.getElementById("score").innerText = score;
      document.getElementById("highscore").innerText = highscore;
      localStorage.setItem("highscore", highscore);
      obstacles = [];
      player.y = canvas.height - player.height;
      player.dy = 0;
      gameRunning = false;
      paused = false;
      gameOver = false;
      document.getElementById("bgMusic").pause();
      document.getElementById("bgMusic").currentTime = 0;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText("Click to Start", canvas.width/2 - 60, canvas.height/2);
      updateTheme();
    }

    function spawnObstacle() {
      let rand = Math.random();
      if(rand < 0.25) {
        obstacles.push({ x: canvas.width, y: canvas.height - 40, width: 40, height: 40, type: "block" });
      } else if(rand < 0.5) {
            function spawnObstacle() {
      let rand = Math.random();
      if(rand < 0.25) {
        // Ground block
        obstacles.push({ x: canvas.width, y: canvas.height - 40, width: 40, height: 40, type: "block" });
      } else if(rand < 0.5) {
        // Ramp block
        obstacles.push({ x: canvas.width, y: canvas.height - 80, width: 50, height: 80, type: "block" });
      } else if(rand < 0.75) {
        // Floating block
        obstacles.push({ x: canvas.width, y: canvas.height - 120, width: 60, height: 30, type: "block" });
      } else {
        // Spike
        obstacles.push({ x: canvas.width, y: canvas.height - 30, width: 30, height: 30, type: "spike" });
      }

      if(gameRunning) {
        let delay = Math.random() * 1000 + 2000; // 2000–3000 ms
        setTimeout(spawnObstacle, delay);
      }
    }

    document.addEventListener("keydown", e => {
      if(e.code === "Space" && player.y >= canvas.height - player.height && gameRunning) {
        player.jump = true;
      }
    });

    canvas.addEventListener("click", () => {
      if(gameOver) startGame();
      else if(!gameRunning && !gameOver) startGame();
    });

    // Show initial "Click to Start" message
    resetGame();
  </script>
</body>
</html>
