<!DOCTYPE html>
<html>
<head>
  <title>OBJECT RUN 🏃</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to bottom, #add8e6, #00008b);
      margin: 0;
      padding: 0;
      color: #fff;
    }
    .title {
      font-size: 3em;
      font-weight: bold;
      margin: 20px 0;
      text-shadow: 3px 3px 8px rgba(0,0,0,0.5);
    }
    #gameBox {
      display: inline-block;
      background: #111;
      border: 4px solid #00f2fe;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      padding: 10px;
    }
    canvas {
      background: #222;
      display: block;
      margin: auto;
      border-radius: 8px;
    }
    #scoreboard {
      margin-top: 15px;
      font-size: 1.2em;
    }
    .backBtn {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 2em;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }
    .backBtn:hover {
      color: #00f2fe;
      transform: scale(1.1);
    }
    #controls {
      margin-top: 10px;
    }
    #controls button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #f39c12;
      color: white;
    }
    #controls button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <button class="backBtn" onclick="location.href='index.html'">←</button>
  <div class="title">OBJECT RUN 🏃</div>

  <div id="gameBox">
    <canvas id="gameCanvas" width="600" height="300"></canvas>
    <div id="scoreboard">
      Score: <span id="score">0</span> | Highest: <span id="highscore">0</span>
    </div>
    <div id="controls">
      <button onclick="pauseGame()">Pause</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let player = { x: 50, y: canvas.height - 30, width: 30, height: 30, dy: 0, jump: false };
    let gravity = 0.8;
    let obstacles = [];
    let score = 0;
    let highscore = localStorage.getItem("highscore") || 0;
    document.getElementById("highscore").innerText = highscore;

    let gameRunning = false;
    let paused = false;
    let gameOver = false;

    function drawPlayer() {
      ctx.fillStyle = "#00f2fe";
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function drawObstacles() {
      obstacles.forEach(o => {
        if(o.type === "block") {
          ctx.fillStyle = "#ff4d4d";
          ctx.fillRect(o.x, o.y, o.width, o.height);
        } else if(o.type === "spike") {
          ctx.fillStyle = "#ffcc00";
          ctx.beginPath();
          ctx.moveTo(o.x, o.y + o.height);          // bottom left
          ctx.lineTo(o.x + o.width/2, o.y);         // top point
          ctx.lineTo(o.x + o.width, o.y + o.height);// bottom right
          ctx.closePath();
          ctx.fill();
        }
      });
    }

    function update() {
      if(!gameRunning || paused) return;

      ctx.clearRect(0,0,canvas.width,canvas.height);

      // Player physics
      if(player.jump) {
        player.dy = -12;
        player.jump = false;
      }
      player.y += player.dy;
      player.dy += gravity;
      if(player.y > canvas.height - player.height) {
        player.y = canvas.height - player.height;
        player.dy = 0;
      }

      // Obstacles
      obstacles.forEach(o => o.x -= 5);
      if(obstacles.length && obstacles[0].x + obstacles[0].width < 0) {
        obstacles.shift();
        score++;
        document.getElementById("score").innerText = score;
        if(score > highscore) {
          highscore = score;
          localStorage.setItem("highscore", highscore);
          document.getElementById("highscore").innerText = highscore;
        }
      }

      // Collision detection
      obstacles.forEach(o => {
        if(player.x < o.x + o.width && player.x + player.width > o.x &&
           player.y < o.y + o.height && player.y + player.height > o.y) {
          endGame();
        }
      });

      drawPlayer();
      drawObstacles();
      requestAnimationFrame(update);
    }

    function pauseGame() {
      paused = !paused;
      if(!paused && gameRunning) update();
    }

    function endGame() {
      gameRunning = false;
      gameOver = true;
      ctx.fillStyle = "white";
      ctx.font = "24px Arial";
      ctx.fillText("Game Over - Click to Restart", canvas.width/2 - 150, canvas.height/2);
    }

    function startGame() {
      score = 0;
      document.getElementById("score").innerText = score;
      obstacles = [];
      player.y = canvas.height - player.height;
      player.dy = 0;
      gameRunning = true;
      paused = false;
      gameOver = false;
      spawnObstacle();
      update();
    }

    function spawnObstacle() {
      let rand = Math.random();
      if(rand < 0.5) {
        // Block (always from ground up)
        let height = Math.random() * 50 + 40;
        obstacles.push({ 
          x: canvas.width, 
          y: canvas.height - height, 
          width: 30, 
          height: height, 
          type: "block" 
        });
      } else {
        // Spike (fixed size, sits on ground)
        obstacles.push({ 
          x: canvas.width, 
          y: canvas.height - 30, 
          width: 30, 
          height: 30, 
          type: "spike" 
        });
      }
      if(gameRunning) setTimeout(spawnObstacle, 2000);
    }

    document.addEventListener("keydown", e => {
      if(e.code === "Space" && player.y >= canvas.height - player.height && gameRunning) {
        player.jump = true;
      }
    });

    // Restart when clicking canvas after game over
    canvas.addEventListener("click", () => {
      if(gameOver) startGame();
    });

    // Start game on first click
    canvas.addEventListener("click", () => {
      if(!gameRunning && !gameOver) startGame();
    });
  </script>
</body>
</html>
