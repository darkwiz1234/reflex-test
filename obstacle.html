
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBJECT RUN 🏃</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    body {
        margin: 0; padding: 0; background: #0b0c10; color: #fff;
        font-family: 'Orbitron', sans-serif; overflow: hidden; user-select: none;
    }
    #game-container {
        position: relative; width: 800px; height: 440px; margin: 50px auto;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); border: 2px solid #1f2833;
    }
    canvas { display: block; width: 100%; height: 100%; background: linear-gradient(to bottom, #090a0f, #1a1a3a); }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .hud { position: absolute; padding: 15px; font-size: 20px; text-shadow: 0 0 10px #0ff; }
    #progress { top: 10px; left: 10px; }
    #best { top: 10px; right: 10px; }
    .btn {
        position: absolute; padding: 10px 20px; font-family: 'Orbitron', sans-serif;
        background: #1f2833; border: 2px solid #0ff; color: #0ff; font-size: 16px;
        cursor: pointer; pointer-events: auto; text-shadow: 0 0 5px #0ff;
        box-shadow: 0 0 10px rgba(0,255,255,0.3); border-radius: 5px; transition: 0.2s;
    }
    .btn:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
    #pauseBtn { bottom: 15px; right: 15px; }
    #resetBtn { bottom: 15px; right: 120px; }
    #message-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center; flex-direction: column;
        background: rgba(0, 0, 0, 0.7); display: none; pointer-events: none;
    }
    #message-text { font-size: 40px; color: #f0f; text-shadow: 0 0 20px #f0f; margin-bottom: 20px; }
    .msg-btn { pointer-events: auto; font-size: 20px; }
</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="440"></canvas>
    <div id="ui-layer">
        <div id="progress" class="hud">PROGRESS: 0%</div>
        <div id="best" class="hud">BEST: 0%</div>
        <button id="resetBtn" class="btn">RESET</button>
        <button id="pauseBtn" class="btn">PAUSE</button>
        <div id="message-overlay">
            <div id="message-text">GAME OVER</div>
            <button id="overlayResetBtn" class="btn msg-btn">TRY AGAIN</button>
        </div>
    </div>
</div>

<audio id="sfx-collision" src="collision.mp3" preload="auto"></audio>
<audio id="sfx-music" src="music.mp3" loop preload="auto"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiProgress = document.getElementById('progress');
const uiBest = document.getElementById('best');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const overlayResetBtn = document.getElementById('overlayResetBtn');
const msgOverlay = document.getElementById('message-overlay');
const msgText = document.getElementById('message-text');

const bgMusic = document.getElementById('sfx-music');
const hitSound = document.getElementById('sfx-collision');

let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER, WIN
let bestProgress = localStorage.getItem('objectRunBest') || 0;
uiBest.innerText = `BEST: ${bestProgress}%`;

// Level Design (Map string) 
// '#' = Block, '^' = Spike (Ground), 'v' = Spike (Ceiling/Under Platform), '.' = Empty
const mapGrid = [
    ".....................................................................................................................................................................................................................................................................................................................................................",
    ".....................................................................................................................................................................................................................................................................................................................................................",
    ".....................................................................................................................................................................................................................................................................................................................................................",
    ".......................................................................................................................................................................######.....................................######.......................................######................................................................................",
    "........................................................######..........................................######.............................######......................vvvvvv..................######.............vvvvvv................######...............vvvvvv.......................................................######...................",
    "........................................................vvvvvv................######..................vvvvvv.............................vvvvvv......................######..................vvvvvv.............######................vvvvvv...............######................######...............................######...................",
    ".........................######.........................######................vvvvvv..................######..............######.........######..........######......vvvvvv.......######.....######.............vvvvvv......######....######...............vvvvvv......######......vvvvvv........######...............######...................",
    "..........######.........vvvvvv.........######..........vvvvvv................######..................vvvvvv..............vvvvvv.........vvvvvv..........vvvvvv......######.......vvvvvv.....vvvvvv.............######......vvvvvv....vvvvvv...............######......vvvvvv......######........vvvvvv...............######...................",
    "..........vvvvvv.........######.........vvvvvv..........######................vvvvvv..................######..............######.........######..........######...................######........................######......######........................######......######......................######...............######...................",
    "....^^....######...^^^...######...^^^...######...^^^^...######...^...^^^..^...######...^^^^...^^^..^..######..^...^^^^..^.######..^^^..^.######..^^...^..######..^^^........^^^..######..^^..........^^^..^^^...######..^^..######...........^^^..^^^...^..######..^..######..^^........^^^..^^..######...^^^^..^^^...######...................",
    "#####################################################################################################################################################################################################################################################################################################################################################"
];

const TILE_SIZE = 40;
let levelWidth = mapGrid[0].length * TILE_SIZE;
let blocks = [];
let spikes = [];

function parseLevel() {
    blocks = []; spikes = [];
    for(let r=0; r<mapGrid.length; r++) {
        for(let c=0; c<mapGrid[r].length; c++) {
            let type = mapGrid[r][c];
            let x = c * TILE_SIZE;
            let y = r * TILE_SIZE;
            if(type === '#') blocks.push({x, y, w: TILE_SIZE, h: TILE_SIZE});
            if(type === '^') spikes.push({x, y, type: 'up'});
            if(type === 'v') spikes.push({x, y, type: 'down'});
        }
    }
}
parseLevel();

let player = { x: 150, y: 320, size: 28, vx: 5.5, vy: 0, gravity: 0.7, jumpForce: -11.5, angle: 0, onGround: false };
let cameraX = 0;
let particles = [];
let musicStarted = false;

function resetGame() {
    player = { x: 150, y: 320, size: 28, vx: 5.5, vy: 0, gravity: 0.7, jumpForce: -11.5, angle: 0, onGround: false };
    cameraX = 0;
    particles = [];
    gameState = 'PLAYING';
    msgOverlay.style.display = 'none';
    if(musicStarted) { bgMusic.play().catch(()=>{}); }
}

function die() {
    gameState = 'GAMEOVER';
    hitSound.currentTime = 0; hitSound.play().catch(()=>{});
    bgMusic.pause();
    msgText.innerText = "GAME OVER";
    msgText.style.color = "#f0f";
    msgOverlay.style.display = 'flex';
    
    // Generate particles
    for(let i=0; i<20; i++) {
        particles.push({
            x: player.x + player.size/2, y: player.y + player.size/2,
            vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 1) * 10,
            size: Math.random() * 8 + 2, life: 1.0, color: i%2===0 ? '#0ff' : '#f0f'
        });
    }
}

function win() {
    gameState = 'WIN';
    msgText.innerText = "LEVEL COMPLETE!";
    msgText.style.color = "#0ff";
    msgOverlay.style.display = 'flex';
}

function jump() {
    if(gameState === 'START') {
        musicStarted = true; bgMusic.play().catch(()=>{});
        gameState = 'PLAYING';
    }
    if(gameState === 'PLAYING' && player.onGround) {
        player.vy = player.jumpForce;
        player.onGround = false;
    }
}

window.addEventListener('keydown', (e) => {
    if(e.code === 'Space' || e.code === 'ArrowUp') jump();
});
window.addEventListener('mousedown', (e) => {
    if(e.target.tagName !== 'BUTTON') jump();
});

function togglePause() {
    if(gameState === 'PLAYING') {
        gameState = 'PAUSED'; bgMusic.pause();
        msgText.innerText = "PAUSED"; msgText.style.color = "#fff";
        msgOverlay.style.display = 'flex';
    } else if(gameState === 'PAUSED') {
        gameState = 'PLAYING'; bgMusic.play().catch(()=>{});
        msgOverlay.style.display = 'none';
    }
}

pauseBtn.addEventListener('click', togglePause);
resetBtn.addEventListener('click', resetGame);
overlayResetBtn.addEventListener('click', resetGame);

function update() {
    if(gameState !== 'PLAYING') return;

    player.vy += player.gravity;
    
    // X Movement & Collision
    player.x += player.vx;
    let hitX = false;
    for(let b of blocks) {
        if(player.x < b.x + b.w && player.x + player.size > b.x &&
           player.y < b.y + b.h && player.y + player.size > b.y) {
            die(); return; // Hit side
        }
    }

    // Y Movement & Collision
    player.y += player.vy;
    player.onGround = false;
    for(let b of blocks) {
        if(player.x < b.x + b.w && player.x + player.size > b.x &&
           player.y < b.y + b.h && player.y + player.size > b.y) {
            if(player.vy > 0) { // Landed on top
                player.y = b.y - player.size;
                player.vy = 0;
                player.onGround = true;
            } else if (player.vy < 0) { // Hit ceiling
                die(); return;
            }
        }
    }

    // Spike Collision (smaller hitbox for fairness)
    let pRect = { x: player.x + 4, y: player.y + 4, w: player.size - 8, h: player.size - 8 };
    for(let s of spikes) {
        let sx = s.x + 8, sy = s.type === 'up' ? s.y + 16 : s.y, sw = 24, sh = 24;
        if(pRect.x < sx + sw && pRect.x + pRect.w > sx && pRect.y < sy + sh && pRect.y + pRect.h > sy) {
            die(); return;
        }
    }

    // Rotation
    if(!player.onGround) player.angle += 0.12;
    else player.angle = Math.round(player.angle / (Math.PI/2)) * (Math.PI/2); // Snap to 90deg

    // Camera follow
    cameraX = player.x - 200;

    // Progress update
    let maxDist = levelWidth - 800;
    let progress = Math.min(100, Math.max(0, Math.floor((player.x / maxDist) * 100)));
    uiProgress.innerText = `PROGRESS: ${progress}%`;
    if(progress > bestProgress) {
        bestProgress = progress;
        localStorage.setItem('objectRunBest', bestProgress);
        uiBest.innerText = `BEST: ${bestProgress}%`;
    }
    
    if(progress >= 100) win();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Grid Background
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    let offsetX = cameraX % TILE_SIZE;
    for(let i=0; i<=canvas.width; i+=TILE_SIZE) { ctx.moveTo(i-offsetX, 0); ctx.lineTo(i-offsetX, canvas.height); }
    for(let i=0; i<=canvas.height; i+=TILE_SIZE) { ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); }
    ctx.stroke();

    ctx.save();
    ctx.translate(-cameraX, 0);

    // Draw Blocks
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#0ff';
    ctx.strokeStyle = '#0ff';
    ctx.fillStyle = '#0b0c10';
    ctx.lineWidth = 2;
    for(let b of blocks) {
        if(b.x > cameraX - TILE_SIZE && b.x < cameraX + 800) {
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeRect(b.x, b.y, b.w, b.h);
        }
    }

    // Draw Spikes
    ctx.shadowColor = '#f0f';
    ctx.fillStyle = '#f0f';
    for(let s of spikes) {
        if(s.x > cameraX - TILE_SIZE && s.x < cameraX + 800) {
            ctx.beginPath();
            if(s.type === 'up') {
                ctx.moveTo(s.x + TILE_SIZE/2, s.y + 4);
                ctx.lineTo(s.x + TILE_SIZE - 4, s.y + TILE_SIZE);
                ctx.lineTo(s.x + 4, s.y + TILE_SIZE);
            } else {
                ctx.moveTo(s.x + 4, s.y);
                ctx.lineTo(s.x + TILE_SIZE - 4, s.y);
                ctx.lineTo(s.x + TILE_SIZE/2, s.y + TILE_SIZE - 4);
            }
            ctx.fill();
        }
    }

    // Draw Player
    if(gameState !== 'GAMEOVER') {
        ctx.shadowColor = '#fff';
        ctx.fillStyle = '#0ff';
        ctx.save();
        ctx.translate(player.x + player.size/2, player.y + player.size/2);
        ctx.rotate(player.angle);
        ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
        ctx.fillStyle = '#fff'; // Inner highlight
        ctx.fillRect(-player.size/4, -player.size/4, player.size/2, player.size/2);
        ctx.restore();
    }

    // Draw Particles
    if(gameState === 'GAMEOVER') {
        ctx.shadowBlur = 5;
        for(let p of particles) {
            if(p.life > 0) {
                p.vy += 0.5; p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.shadowColor = p.color; ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
        }
        ctx.globalAlpha = 1.0;
    }

    ctx.restore();

    // Start text overlay
    if(gameState === 'START') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0,0,800,440);
        ctx.fillStyle = '#0ff'; ctx.font = '24px Orbitron'; ctx.textAlign = 'center';
        ctx.shadowBlur = 10; ctx.shadowColor = '#0ff';
        ctx.fillText("CLICK OR PRESS SPACE TO START", 400, 220);
        ctx.textAlign = 'left';
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
</body>
</html>
